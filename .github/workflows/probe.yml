name: Original statement probe
on:
  push:
    branches: [research/next-prize-20260917]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public mathematical statements
        shell: python
        run: |
          import urllib.request, urllib.error, re, json, subprocess, pathlib
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]; self.skip=0
              def handle_starttag(self,t,a):
                  if t in ('script','style'): self.skip+=1
              def handle_endtag(self,t):
                  if t in ('script','style'): self.skip=max(0,self.skip-1)
              def handle_data(self,d):
                  if not self.skip and d.strip(): self.parts.append(d.strip())
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0 public mathematical research'}),timeout=30) as r: return r.read().decode()
              except Exception as e: return 'FETCH_FAILED '+str(e)
          subprocess.run(['git','clone','--depth','1','https://github.com/google-deepmind/formal-conjectures.git','/tmp/conjectures'],check=True)
          root=pathlib.Path('/tmp/conjectures/FormalConjectures/ErdosProblems')
          print('FORMAL_CONJECTURES_SHA',subprocess.check_output(['git','-C','/tmp/conjectures','rev-parse','HEAD'],text=True).strip())
          for p in sorted(root.glob('*.lean')):
              s=p.read_text()
              if re.search(r'permut|reorder',s,re.I) and re.search(r'\bprime',s,re.I):
                  print('PRIME_PERMUTATION_SOURCE',p.name); print(s[:16000])
          for n in (771,783,1015,1212):
              print('ORIGINAL_PROBLEM',n)
              h=get(f'https://www.erdosproblems.com/{n}')
              parser=Text(); parser.feed(h); print('\n'.join(parser.parts)[:15000])
          yaml=get('https://raw.githubusercontent.com/teorth/erdosproblems/main/data/problems.yaml')
          for block in yaml.split('\n- number:'):
              if re.search(r'state: "(?:decidable|verifiable|falsifiable)"',block):
                  m=re.search(r'"(\d+)"',block)
                  if not m: continue
                  n=int(m.group(1)); p=root/f'{n}.lean'
                  print('FINITE_SEARCH_CANDIDATE',n,block[:900])
                  if p.exists(): print(p.read_text()[:10000])
