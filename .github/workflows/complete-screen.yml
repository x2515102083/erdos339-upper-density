name: Complete statement screening
on:
  push:
    branches: [research/prize-complete-20260918]
    paths: ['.github/workflows/complete-screen.yml']
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read public statement repository at a fixed revision
        shell: python
        run: |
          import io, re, tarfile, urllib.request
          rev='d5ba143cc2fafd48cc6d5b6320a3aab287c38df7'
          url=f'https://api.github.com/repos/google-deepmind/formal-conjectures/tarball/{rev}'
          with urllib.request.urlopen(url, timeout=60) as r: data=r.read()
          t=tarfile.open(fileobj=io.BytesIO(data), mode='r:gz')
          choices=[]
          for f in t.getmembers():
              if '/FormalConjectures/ErdosProblems/' not in f.name or not f.name.endswith('.lean'): continue
              s=t.extractfile(f).read().decode()
              if 'category research solved' not in s: continue
              if 'formal_proof' in s or 'formalized' in s.lower() or 'formalised' in s.lower(): continue
              body=s.split('namespace ',1)[-1]
              if 'category research open' in body: continue
              choices.append((len(body), f.name.rsplit('/',1)[-1], body))
          choices.sort()
          print('SOURCE', rev, 'CANDIDATES',len(choices))
          for length,name,s in choices[:75]:
              print('\n===== COMPLETE_CANDIDATE', name, length, '=====\n'+s)
          print('Screening is not proof, novelty certification, or eligibility confirmation.')
