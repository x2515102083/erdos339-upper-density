name: Complete small Ramsey counterexample
on:
  push:
    branches: [research/prize-complete-20260918]
    paths: ['research/erdos549-small/**', '.github/workflows/small-ramsey.yml']
permissions:
  contents: read
concurrency:
  group: small-ramsey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean release
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          echo /tmp/lean/bin >> "$GITHUB_PATH"
      - name: Fetch all dependencies using the committed lockfile
        working-directory: research/erdos549-small
        run: |
          set -euo pipefail
          lean --version
          python3 bootstrap.py
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Build and freshly elaborate complete proof with warnings as errors
        working-directory: research/erdos549-small
        run: |
          set -euo pipefail
          lake build 2>&1 | tee build.log
          lake env lean -DwarningAsError=true Small.lean 2>&1 | tee axioms.log
          python3 audit.py axioms.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Independent arithmetic witness and byte checks
        working-directory: research/erdos549-small
        run: |
          set -euo pipefail
          python3 verify.py --output results.json
          python3 bootstrap.py
          echo '129f0f29aa613d6c12964679e8e06c9c0e76cd51134ddb10432d34c93874e891  Small.lean' | sha256sum -c -
          echo 'ab172e753bb753cd86ad81cbffaa55c0e1f78c65908e70ffd5ee6ede60cfd159  RamseyDefs.lean' | sha256sum -c -
          echo "Verified source: $GITHUB_SHA"
          sha256sum Small.lean RamseyDefs.lean lean-toolchain lakefile.toml lake-manifest.json bootstrap.py audit.py verify.py results.json
          echo 'Complete original-formula negation checked. Not an award decision, independent human review, or priority certificate.'
