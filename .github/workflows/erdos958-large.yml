name: Erdős 958 uniform-arc research
on:
  push:
    branches: [research/erdos958-large-20260918]
    paths: ['research/erdos958-large/**', '.github/workflows/erdos958-large.yml']
permissions:
  contents: read
concurrency:
  group: erdos958-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          echo /tmp/lean/bin >> "$GITHUB_PATH"
      - name: Fetch locked dependencies
        working-directory: research/erdos549-small
        run: |
          set -euo pipefail
          lean --version
          python3 bootstrap.py > /tmp/bootstrap.log 2>&1 || { cat /tmp/bootstrap.log; exit 1; }
          grep PIN_VERIFIED /tmp/bootstrap.log
          lake exe cache get > /tmp/cache.log 2>&1 || { cat /tmp/cache.log; exit 1; }
          tail -n 3 /tmp/cache.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Check geometry and counting independently
        working-directory: research/erdos549-small
        run: |
          set -uo pipefail
          cp ../erdos958-large/*.lean .
          export LEAN_PATH=".:$(lake env printenv LEAN_PATH)"
          status=0
          lake env lean -o Geometry.olean Geometry.lean 2>&1 | tee geometry.log || status=1
          lake env lean -o Counting.olean Counting.lean 2>&1 | tee counting.log || status=1
          if [ "$status" = 0 ] && [ -f Complete.lean ]; then
            lake env lean -DwarningAsError=true Complete.lean 2>&1 | tee complete.log || status=1
          fi
          echo 'Only the files above were checked. This is not an award or priority decision.'
          exit "$status"
