name: Erdős 958 uniform-arc research
on:
  push:
    branches: [research/erdos958-large-20260918]
    paths: ['research/erdos958-large/**', '.github/workflows/erdos958-large.yml']
permissions:
  contents: read
concurrency:
  group: erdos958-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          echo /tmp/lean/bin >> "$GITHUB_PATH"
      - name: Fetch locked dependencies
        working-directory: research/erdos549-small
        run: |
          set -euo pipefail
          lean --version
          python3 bootstrap.py
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Read exact public distance definitions
        shell: python
        run: |
          import io, tarfile, urllib.request
          rev='d5ba143cc2fafd48cc6d5b6320a3aab287c38df7'
          with urllib.request.urlopen(f'https://api.github.com/repos/google-deepmind/formal-conjectures/tarball/{rev}',timeout=60) as r:
            data=r.read()
          t=tarfile.open(fileobj=io.BytesIO(data),mode='r:gz')
          for f in t.getmembers():
            if not f.name.endswith('.lean') or 'Util' not in f.name: continue
            s=t.extractfile(f).read().decode()
            if 'def distanceMultiplicity' not in s and 'def distanceSet' not in s: continue
            print('EXACT SOURCE',rev,f.name)
            lines=s.splitlines()
            for i,line in enumerate(lines):
              if 'def distanceMultiplicity' in line or 'def distanceSet' in line:
                print('\n'.join(lines[max(0,i-5):i+65]))
      - name: Check all current research files without claiming completion
        working-directory: research/erdos549-small
        run: |
          set -euo pipefail
          cp ../erdos958-large/*.lean .
          lake env lean -o Geometry.olean Geometry.lean 2>&1 | tee geometry.log
          if [ -f Counting.lean ]; then lake env lean -o Counting.olean Counting.lean 2>&1 | tee counting.log; fi
          if [ -f Complete.lean ]; then lake env lean -DwarningAsError=true Complete.lean 2>&1 | tee complete.log; fi
          echo 'Checked only the files printed above. Award and priority review remain separate.'
