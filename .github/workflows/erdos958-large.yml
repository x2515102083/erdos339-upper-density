name: Erdős 958 complete uniform-arc verification
on:
  push:
    branches: [research/erdos958-large-20260918]
    paths: ['research/erdos958-large/**', '.github/workflows/erdos958-large.yml']
permissions:
  contents: read
concurrency:
  group: erdos958-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          echo /tmp/lean/bin >> "$GITHUB_PATH"
      - name: Fetch locked standalone dependencies
        working-directory: research/erdos958-large
        run: |
          set -euo pipefail
          python3 bootstrap.py > /tmp/bootstrap.log 2>&1 || { cat /tmp/bootstrap.log; exit 1; }
          grep PIN_VERIFIED /tmp/bootstrap.log
          lake exe cache get > /tmp/cache.log 2>&1 || { cat /tmp/cache.log; exit 1; }
          tr '\r' '\n' < /tmp/cache.log | tail -n 4
      - name: Compile all sources strictly and audit endpoint axioms
        working-directory: research/erdos958-large
        run: |
          set -euo pipefail
          python3 verify.py
          git diff --exit-code -- Geometry.lean Counting.lean Complete.lean lean-toolchain lakefile.toml lake-manifest.json bootstrap.py verify.py
