name: Verify next problem proofs
on:
  push:
    branches: [next-problems-20260917]
permissions:
  contents: read
concurrency:
  group: next-problems-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib dependencies
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get > cache.log 2>&1 || { tail -n 100 cache.log; exit 1; }
          tail -n 3 cache.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Compile all new proof files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in NextProblems/*.lean; do
            echo "=== Checking $file ==="
            if ! lake env lean "$file" 2>&1 | tee "$(basename "$file").log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Check reported target axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = '\n'.join(p.read_text() for p in Path('.').glob('*.lean.log'))
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          reports = dict(re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text, re.S))
          for target in re.findall(r"'([^']+)' does not depend on any axioms", text):
              reports[target] = ''
          required = {
              'NextProblems.PowerfulPairs.seed_good',
              'NextProblems.PowerfulPairs.arbitrarily_large',
              'NextProblems.PowerfulPairs.jsp_000301',
              'NextProblems.Erdos1209.simultaneous_unique_shift',
              'NextProblems.Erdos1209.erdos_1209_i',
              'NextProblems.Erdos1209.erdos_1209_ii',
          }
          missing = required - reports.keys()
          if missing:
              raise SystemExit(f'Missing reports: {missing}')
          for target, report in reports.items():
              axioms = {a.strip() for a in report.split(',') if a.strip()}
              if axioms - allowed:
                  raise SystemExit(f'Unapproved axioms for {target}: {axioms - allowed}')
              print(target, sorted(axioms))
          if 'sorryAx' in text:
              raise SystemExit('Missing-proof axiom detected')
          print('Verified revision and files:')
          PY
          git rev-parse HEAD
          sha256sum NextProblems/*.lean lean-toolchain lake-manifest.json
