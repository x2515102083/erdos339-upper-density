name: Next problem screening
on:
  push:
    branches: [next-problems-20260917]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public problem statements without changing any records
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/google-deepmind/formal-conjectures.git /tmp/formal-conjectures
          git clone --depth 1 https://github.com/TheJustinSunPrize/awards.git /tmp/awards
          echo "Formal Conjectures revision: $(git -C /tmp/formal-conjectures rev-parse HEAD)"
          echo "Awards revision: $(git -C /tmp/awards rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          records = []
          for p in Path('/tmp/formal-conjectures/FormalConjectures/ErdosProblems').glob('*.lean'):
              s = p.read_text()
              if 'category research solved' in s and 'category research open' not in s and 'formal_proof' not in s:
                  start = s.find('namespace ')
                  t = s[start:] if start >= 0 else s
                  records.append((len(t), p.stem, t))
          for size, number, text in sorted(records)[:45]:
              print('\n=== ERDOS', number, 'STATEMENT LENGTH', size, '===')
              print(text)
          print('\n=== SOLVED CATALOG ENTRIES WITHOUT LEAN ===')
          for line in Path('/tmp/awards/problems/README.md').read_text().splitlines():
              if '| Solved | No |' in line:
                  print(line)
          PY
