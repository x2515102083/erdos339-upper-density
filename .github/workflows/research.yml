name: LCM real-threshold formalization
on:
  push:
    branches: [research/prize-lcm-20260918]
permissions:
  contents: read
concurrency:
  group: lcm-real-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Lean 4.33.0
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          echo /tmp/lean/bin >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/packages
          key: lcm-lean433-mathlib-db584cd6d46c92f209a44c0f1c829460d327499d
      - name: Fetch exact pinned source closure
        run: |
          set -euo pipefail
          lean --version
          python3 bootstrap.py
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Build all proof modules
        run: |
          set -euo pipefail
          lake build 2>&1 | tee build.log
      - name: Freshly check and audit both new proof files
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true Proof.lean 2>&1 | tee proof-axioms.log
          lake env lean -DwarningAsError=true Cutoff.lean 2>&1 | tee cutoff-axioms.log
          cat proof-axioms.log cutoff-axioms.log > axioms.log
          python3 audit.py axioms.log
          python3 bootstrap.py
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          sha256sum Proof.lean Cutoff.lean bootstrap.py audit.py lean-toolchain lakefile.toml lake-manifest.json audit-result.json
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo 'Not an independent-operator review, designated isolated audit, priority certificate, or award decision.'
