name: LCM real-threshold formalization
on:
  push:
    branches: [research/prize-lcm-20260918]
permissions:
  contents: read
concurrency:
  group: lcm-real-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Lean 4.33.0
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          echo /tmp/lean/bin >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/packages
          key: lcm-lean433-mathlib-db584cd6d46c92f209a44c0f1c829460d327499d
      - name: Fetch exact pinned source closure
        run: |
          set -euo pipefail
          lean --version
          python3 bootstrap.py
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Build attributed natural-threshold core
        run: |
          set -euo pipefail
          lake build 2>&1 | tee core.log
      - name: Freshly check the new real-threshold proof
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true Proof.lean 2>&1 | tee axioms.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          sha256sum Proof.lean bootstrap.py lean-toolchain lakefile.toml lake-manifest.json
          echo "SOURCE_COMMIT=$GITHUB_SHA"
