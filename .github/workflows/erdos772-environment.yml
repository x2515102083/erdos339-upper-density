name: Erdos 772 pinned proof environment
on:
  push:
    branches: [proof/erdos772-symmetry-20260918]
    paths: ['.github/workflows/erdos772-environment.yml']
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the public pinned Lean release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof-environment/lean /tmp/proof-environment/project
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/proof-environment/lean --strip-components=1
          echo /tmp/proof-environment/lean/bin >> "$GITHUB_PATH"
      - name: Prepare public Mathlib dependencies at the pinned revision
        shell: bash
        working-directory: /tmp/proof-environment/project
        run: |
          set -euo pipefail
          printf 'leanprover/lean4:v4.32.1\n' > lean-toolchain
          cat > lakefile.toml <<'EOF'
          name = "Erdos772Symmetry"
          version = "0.1.0"
          defaultTargets = ["Core"]
          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "520045ab14e26149ee970e2e617ca04b09bde5d6"
          [[lean_lib]]
          name = "Core"
          EOF
          printf 'import Mathlib\n' > Core.lean
          mkdir -p .lake/packages/mathlib
          git -C .lake/packages/mathlib init
          git -C .lake/packages/mathlib remote add origin https://github.com/leanprover-community/mathlib4.git
          git -C .lake/packages/mathlib fetch --depth=1 origin 520045ab14e26149ee970e2e617ca04b09bde5d6
          git -C .lake/packages/mathlib checkout --detach 520045ab14e26149ee970e2e617ca04b09bde5d6
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 520045ab14e26149ee970e2e617ca04b09bde5d6
          lake exe cache get
          lake env lean Core.lean
          lean --version > environment.txt
          sha256sum lean-toolchain lakefile.toml lake-manifest.json >> environment.txt
          echo 'Environment preparation only; no Erdos theorem has been proved by this run.' >> environment.txt
      - name: Archive and split public proof-development dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf /tmp/erdos772-public-environment.tar.zst -C /tmp proof-environment
          split -b 400M -d -a 2 /tmp/erdos772-public-environment.tar.zst /tmp/env-
          sha256sum /tmp/erdos772-public-environment.tar.zst /tmp/env-* | tee /tmp/environment-sha256.txt
          test "$(find /tmp -maxdepth 1 -name 'env-*' | wc -l)" -le 9
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-manifest
          path: /tmp/environment-sha256.txt
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-00
          path: /tmp/env-00
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-01
          path: /tmp/env-01
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-02
          path: /tmp/env-02
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-03
          path: /tmp/env-03
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-04
          path: /tmp/env-04
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-05
          path: /tmp/env-05
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-06
          path: /tmp/env-06
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-07
          path: /tmp/env-07
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: erdos772-environment-08
          path: /tmp/env-08
          compression-level: 0
          retention-days: 2
