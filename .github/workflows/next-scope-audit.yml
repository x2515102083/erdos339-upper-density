name: Prior scope and targeted library audit
on:
  push:
    branches: [research/complete-next-20260918-b]
    paths: ['.github/workflows/next-scope-audit.yml']
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)
        with:
          persist-credentials: false
      - name: Fetch pinned compiler and selected dependencies
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst -o /tmp/lean.tar.zst
          mkdir /tmp/lean
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
          rm /tmp/lean.tar.zst
          export PATH=/tmp/lean/bin:$PATH
          cd research/erdos549-small
          python3 bootstrap.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.lake/packages/mathlib')
          wanted=['Mathlib/Tactic.lean','Mathlib/Combinatorics/SimpleGraph/Coloring.lean','Mathlib/Combinatorics/SimpleGraph/Acyclic.lean','Mathlib/NumberTheory/ArithmeticFunction/Basic.lean','Mathlib/Analysis/SpecialFunctions/Pow/Real.lean','Mathlib/Algebra/Order/Antidiag/Pi.lean','Mathlib/Data/Nat/Factorization/Basic.lean','Mathlib/Data/Finset/Powerset.lean']
          selected=[str(root/p) for p in wanted if (root/p).is_file()]
          if str(root/'Mathlib/Tactic.lean') not in selected: raise SystemExit('missing required tactic module')
          Path('/tmp/cache-targets.txt').write_text('\n'.join(selected)+'\n')
          print('Selected modules:',*selected,sep='\n')
          print('Unavailable optional modules:',*[p for p in wanted if not (root/p).is_file()],sep='\n')
          PY
          xargs -d '\n' lake exe cache get </tmp/cache-targets.txt
          git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.toml
          tar --exclude='.git' --exclude='*.a' --exclude='*.o' --exclude='*.c' --exclude='*.ilean' --exclude='*.trace' --exclude='*.hash' -I 'zstd -T0 -10' -cf /tmp/targeted-library.tar.zst .lake lake-manifest.json lakefile.toml lean-toolchain bootstrap.py
          cd /tmp
          split -b 450M -d targeted-library.tar.zst targeted-part-
          sha256sum targeted-library.tar.zst targeted-part-* | tee targeted-hashes.txt
          test ! -f targeted-part-04
          ls -lh targeted-part-*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: targeted-part-00
          path: |
            /tmp/targeted-part-00
            /tmp/targeted-hashes.txt
            /tmp/cache-targets.txt
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: targeted-part-01
          path: /tmp/targeted-part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: targeted-part-02
          path: /tmp/targeted-part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: targeted-part-03
          path: /tmp/targeted-part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
