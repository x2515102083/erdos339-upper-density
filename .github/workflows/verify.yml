name: Verify Lean proof

on:
  push:
    branches: [complete-original-problem]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact submitted commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)
      - name: Install elan and the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore and checksum-check the pinned proof dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 bootstrap.py
      - name: Build using the committed dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          lake build 2>&1 | tee build.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Print theorem statements and audit their axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean 2>&1 | tee axiom-audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('axiom-audit.log').read_text()
          reports = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          expected = {'Erdos339.erdos_339_upperDensity', 'Erdos339.upperDensity_nsmul_le_restrictedSums'}
          if Path('Erdos339/Complete.lean').exists():
              expected |= {'Erdos339.erdos_339', 'Erdos339.erdos_339_complete'}
          seen = set()
          for name, axioms in reports:
              if name in expected:
                  used = {a.strip() for a in axioms.split(',') if a.strip()}
                  unexpected = used - {'propext', 'Classical.choice', 'Quot.sound'}
                  if unexpected:
                      raise SystemExit(f'Unexpected axioms for {name}: {sorted(unexpected)}')
                  seen.add(name)
          if seen != expected:
              raise SystemExit(f'Missing axiom reports: {sorted(expected - seen)}')
          print('All target theorems use only the permitted standard axioms.')
          PY
      - name: Record the verified revision
        shell: bash
        run: |
          set -euo pipefail
          echo "Verified Git commit: $(git rev-parse HEAD)"
          sha256sum lean-toolchain lakefile.toml lake-manifest.json bootstrap.py Audit.lean
          echo 'This workflow is a Lean build and axiom audit, not an official prize decision or independent-checker verification.'
