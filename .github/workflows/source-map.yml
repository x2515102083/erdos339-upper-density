name: Locate candidate statement sources
on:
  push:
    branches: [research/new-complete-20260918]
    paths: ['.github/workflows/source-map.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Locate original identifiers, not establish result status
        shell: python
        run: |
          import json,urllib.request,re,hashlib
          url='https://raw.githubusercontent.com/kevinfff08/erdos_ai_solvability_review/master/source/erdos_problems_full.json'
          with urllib.request.urlopen(url,timeout=40) as f: data=f.read()
          print('SNAPSHOT_SHA256',hashlib.sha256(data).hexdigest())
          obj=json.loads(data)
          print('TOP_TYPE',type(obj).__name__)
          if isinstance(obj,dict):print('TOP_KEYS',list(obj)[:20])
          def visit(x,path='root'):
              if isinstance(x,dict):
                  scalar={k:v for k,v in x.items() if isinstance(v,(str,int,float,bool))}
                  text=' '.join(str(v) for v in scalar.values()).lower()
                  needles=[('permut' in text and 'prime' in text),('progression' in text and ('hunter' in text or 'slowly' in text)),('divisor' in text and 'sárközy' in text),('divisor' in text and 'fixed infinite' in text),('subset' in text and 'freiman' in text),('wheel' in text),('ratios' in text and 'divisor' in text)]
                  if any(needles):print('MATCH',path,json.dumps(x,ensure_ascii=False)[:14500])
                  for k,v in x.items():
                      if isinstance(v,(dict,list)):visit(v,path+'/'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x):visit(v,path+'/'+str(i))
          visit(obj)
          print('This third-party snapshot is used to locate identifiers and primary references only. Current status, precise scope and proofs require source review.')
